[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gplan"
version = "0.1.0"
description = "GFlowNet samplers as amortized planners for LeWorldModel"
readme = "README.md"
requires-python = ">=3.11"
# Versions are the ones the code was verified with (DLA conda env, Python 3.11).
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "numpy==2.4.6",
    "einops==0.7.0",
    "h5py==3.16.0",
    "hdf5plugin==7.1.0",   # registers the compression filter used by the LeWM .h5 files
    "wandb==0.21.0",
    "hydra-core==1.3.7",   # settings of train.py / evaluate.py / run.py (configs/), with omegaconf 2.3
]

[project.optional-dependencies]
eval = [
    "stable-worldmodel==0.0.6",
    "gymnasium>=1.0",       # stable-worldmodel needs >=1.0 (0.29.x fails to import)
    "imageio",              # only for --video-dir
]
# Reacher (DMControl) and Cube (OGBench): MuJoCo simulation, rendered offscreen with EGL on Linux.
# dm_control pulls in labmaze, which has no wheel for Python >= 3.13 and is not needed here; on 3.13
# install dm_control with --no-deps (see README).
mujoco = [
    "mujoco==3.16.0",
    "dm_control==1.0.49",
    "ogbench==1.2.1",
]
convert = [   # LeWM weights (convert_lewm.py) and datasets (download_data.py) from the Hugging Face Hub
    "huggingface_hub==0.36.2",
    "transformers==4.37.2",
    "zstandard==0.25.0",
]
test = ["pytest>=7.4", "ruff"]
# JAX training. `jax` = CPU (any OS, enough for the tests); `jax-cuda` = NVIDIA GPU with CUDA 13
# (Linux x86_64 / aarch64, driver >= 580), e.g. DGX Spark / GB10.
jax = ["jax==0.11.2", "equinox==0.13.8", "optax==0.2.8"]
jax-cuda = ["jax[cuda13]==0.11.2", "equinox==0.13.8", "optax==0.2.8"]

[tool.setuptools]
packages = ["gplan", "gplan.torch", "gplan.jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end runs and training to convergence (minutes); skip with -m 'not slow'"]

[tool.ruff]
line-length = 120
extend-exclude = ["le-wm", "stable-pretraining"]

[tool.ruff.lint]
select = ["F", "I"]   # pyflakes + import order

[tool.ruff.lint.isort]
known-first-party = ["gplan"]
order-by-type = false
